<html>

<head>
    <meta charset="UTF-8">
    <title>Loja JMS</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #fffffd;
            text-align: center;
        }

        .cabecario {
            background: #000000;
            color: #FFD700;
            padding: 20px;
        }

        .cabecario a {
            color: #FFD700;
            margin: 15px;
            text-decoration: none;
        }

        .cabecario a:hover {
            color: #fff;
        }

        .inicio {
            padding: 20px;
        }

        .produtos-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .produto {
            background: white;
            padding: 20px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid;
        }

        .produto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 4px;
        }

        button {
            background: #000000;
            color: #FFD700;
            border: 0;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #FFD700;
            color: #000;
            border: 1px solid;
        }
    </style>
</head>

<body>

    <div class="cabecario">
        <h1>Loja JMS - Grajaú</h1>

        <div>
            <a href="loja.html">Início</a>
            <a href="bolsas.html">Bolsas</a>
            <a href="contato.html">Contato</a>
            <a href="sobre.html">Sobre</a>
        </div>
    </div>

    <div class="inicio">

        <h2>Bem-vindo à Loja JMS</h2>
        <p>Encontre a bolsa perfeita para você!</p>

        <div class="produtos-container">

            <div class="produto">
                <img src="imagens/bolsaFeminina.jpg" alt="Bolsa bolsaFeminina">
                <h3>Bolsa Feminina</h3>
                <p>R$ 99,90</p>
                <button>Comprar</button>
            </div>

            <div class="produto">
                <img src="imagens/bolsaFemininaCasual.jpg" alt="Bolsa Feminina Casual">
                <h3>Bolsa Feminina Casual</h3>
                <p>R$ 79,90</p>
                <button>Comprar</button>
            </div>

            <div class="produto">
                <img src="imagens/mochilaInfantilTigre.jpg" alt="Bolsa Infantil Azul com Tigre">
                <h3>Bolsa Infantil Tigre</h3>
                <p>R$ 109,90</p>
                <button>Comprar</button>
            </div>

            <div class="produto">
                <img src="imagens/mochilaInfantilRoxaDino.jpg" alt="Bolsa Infantil Roxa com Dinossauro">
                <h3>Bolsa Infantil</h3>
                <p>R$ 109,90</p>
                <button>Comprar</button>
            </div>

        </div>

    </div>

</body>

</html>
